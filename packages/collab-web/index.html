<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ee" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210" />

		<title>Oz · live run</title>
		<meta name="description" content="Watch an Oz coding run as it happens, and steer it if your link allows. Encrypted end to end." />
		<!-- A join page carries a room key in its fragment: never index it, never send a referrer. -->
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />

		<link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./public/favicon-180x180.png" />
		<link rel="manifest" href="./public/manifest.webmanifest" />
	</head>
	<body>
		<div id="root"></div>
		<script>(function(){try{var s=localStorage.getItem("omp-collab-theme");var sys=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var t=(s==="light"||s==="dark")?s:sys;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
